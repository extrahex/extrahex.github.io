<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>extrahex</title>
<style>
html, body { margin: 0; height: 100%; background: #454B4A; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
h1 {
	margin: 0;
	color: #fff;
	font: 800 18vw/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
	letter-spacing: -0.02em;
	white-space: nowrap;
}
</style>
</head>
<body>
<h1 id="t">extrahex</h1>
<script>
var t = document.getElementById("t");
function fit() {
	t.style.fontSize = "100px";
	t.style.fontSize = (100 * window.innerWidth / t.getBoundingClientRect().width) + "px";
}
fit();
window.addEventListener("resize", fit);
if (document.fonts) document.fonts.ready.then(fit);
</script>
</body>
</html>
